[package]
name = "granite-cli"
version = "0.1.0"
edition = "2021"
description = "A terminal-first markdown knowledge base with git-synced persistence"

[[bin]]
name = "granite"
path = "src/main.rs"

[dependencies]
granite-core = { path = "../granite-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rust-embed = "8"

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3"
tempfile = "3"
