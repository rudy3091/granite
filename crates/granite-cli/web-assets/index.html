<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Granite</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; }
      #sidebar { width: 260px; flex-shrink: 0; border-right: 1px solid #e5e7eb; overflow-y: auto; padding: .5rem; }
      #sidebar h1 { font-size: 1rem; padding: .5rem; }
      #note-list { list-style: none; }
      #note-list li a { display: block; padding: .4rem .5rem; border-radius: 4px; color: #1a1a1a; text-decoration: none; font-size: .9rem; }
      #note-list li a:hover, #note-list li a.active { background: #eff6ff; }
      #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #toolbar { display: flex; align-items: center; gap: .75rem; padding: .5rem .75rem; border-bottom: 1px solid #e5e7eb; }
      #toolbar button { padding: .35rem .9rem; border: 1px solid #d1d5db; border-radius: 4px; background: #2563eb; color: #fff; cursor: pointer; }
      #status { color: #6b7280; font-size: .85em; }
      #editor { flex: 1; overflow: auto; }
      .cm-editor { height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/web/main.js"></script>
  </body>
</html>
